version: "2"

run:
  modules-download-mode: readonly

linters:
  default: standard
  settings:
    govet:
      # Additional gopls correctness checks beyond govet's default suite.
      enable:
        - atomicalign
        - deepequalerrors
        - nilness
        - reflectvaluecompare
        - sortslice
        - unusedwrite
  exclusions:
    rules:
      - path: ^client(_test)?\.go$
        linters:
          - staticcheck
        text: 'SA1019:.*golang\.org/x/net/http2\.Transport'

formatters:
  enable:
    - gofumpt
    - goimports
