version: "2"

run:
  modules-download-mode: readonly

linters:
  default: standard
  settings:
    govet:
      # Additional gopls correctness checks beyond govet's default suite.
      enable:
        - atomicalign
        - deepequalerrors
        - nilness
        - reflectvaluecompare
        - sortslice
        - unusedwrite

formatters:
  enable:
    - gofumpt
    - goimports
